<!DOCTYPE html>
<html>
<head>
    <title>Retro Atari Pong - Clean & Infinite</title>
    <style>
        body { 
            background: #111; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            color: #eee;
        }

        #game-container {
            position: relative;
            line-height: 0;
        }

        /* The CRT Filter Class */
        .crt-active::after {
            content: " ";
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 2;
        }

        canvas { 
            background: #000; 
            border: 8px solid #555; 
            image-rendering: pixelated;
        }

        #ui { margin-top: 20px; text-align: center; }
        
        button { 
            padding: 10px 20px; 
            font-size: 14px; 
            cursor: pointer; 
            background: #444; 
            color: #eee;
            border: 4px solid #777; 
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            margin: 5px;
        }
        button:hover { background: #666; color: #fff; }

        #settings-menu {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            border: 4px solid #ddd;
            padding: 30px;
            text-align: center;
            z-index: 10;
            min-width: 250px;
        }
        
        .setting-group { margin-bottom: 25px; }
        input[type=range] { width: 100%; cursor: pointer; }
        label { display: block; font-size: 16px; letter-spacing: 1px; margin-bottom: 10px; }
        
        /* Toggle Switch Styling */
        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #444; transition: .4s;
        }
        .slider:before {
            position: absolute; content: "";
            height: 26px; width: 26px; left: 4px; bottom: 4px;
            background-color: white; transition: .4s;
        }
        input:checked + .slider { background-color: #555; border: 1px solid #fff; }
        input:checked + .slider:before { transform: translateX(26px); }
    </style>
</head>
<body>

    <div id="game-container" class="crt-active">
        <canvas id="pong" width="600" height="400"></canvas>
        
        <div id="settings-menu">
            <h2 style="margin-top:0">SYSTEM SETTINGS</h2>
            
            <div class="setting-group">
                <label>PADDLE SENSITIVITY: <span id="sens-value">8</span></label>
                <input type="range" id="sensitivity" min="1" max="20" value="8">
            </div>

            <div class="setting-group">
                <label>CRT FILTER</label>
                <label class="switch">
                    <input type="checkbox" id="crt-toggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
            
            <button onclick="toggleSettings()">RETURN TO GAME</button>
        </div>
    </div>
    
    <div id="ui">
        <button onclick="toggleSettings()">SETTINGS</button>
        <div style="color: #444; margin-top: 10px; font-size: 12px; letter-spacing: 2px;">PONG</div>
    </div>

<script>
const canvas = document.getElementById("pong");
const ctx = canvas.getContext("2d");
const container = document.getElementById("game-container");
const settingsMenu = document.getElementById("settings-menu");
const sensInput = document.getElementById("sensitivity");
const sensValueDisplay = document.getElementById("sens-value");
const crtToggle = document.getElementById("crt-toggle");

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(freq, duration) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

// State
let paddleSpeed = 8;
let isPaused = false;
const paddleWidth = 12, paddleHeight = 70;
const ballSize = 10;
const CONSTANT_SPEED = 5; 

const player = { x: 20, y: canvas.height/2 - 35 };
const computer = { x: canvas.width - 32, y: canvas.height/2 - 35 };
const ball = { x: 300, y: 200, size: ballSize, velX: CONSTANT_SPEED, velY: 3 };

let upPressed = false;
let downPressed = false;

window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowUp") { upPressed = true; e.preventDefault(); }
    if (e.key === "ArrowDown") { downPressed = true; e.preventDefault(); }
});

window.addEventListener("keyup", (e) => {
    if (e.key === "ArrowUp") upPressed = false;
    if (e.key === "ArrowDown") downPressed = false;
});

// Settings Logic
sensInput.addEventListener("input", (e) => {
    paddleSpeed = parseInt(e.target.value);
    sensValueDisplay.innerText = paddleSpeed;
});

crtToggle.addEventListener("change", (e) => {
    if (e.target.checked) container.classList.add("crt-active");
    else container.classList.remove("crt-active");
});

function toggleSettings() {
    isPaused = !isPaused;
    settingsMenu.style.display = isPaused ? "block" : "none";
}

function resetBall() {
    ball.x = canvas.width / 2;
    ball.y = canvas.height / 2;
    ball.velX = (ball.velX > 0 ? -1 : 1) * CONSTANT_SPEED;
    ball.velY = (Math.random() - 0.5) * 6;
    playSound(150, 0.1);
}

function update() {
    if (isPaused) return;

    if (upPressed && player.y > 0) player.y -= paddleSpeed;
    if (downPressed && player.y < canvas.height - paddleHeight) player.y += paddleSpeed;

    ball.x += ball.velX;
    ball.y += ball.velY;

    let cpCenter = computer.y + paddleHeight/2;
    if (cpCenter < ball.y - 10) computer.y += 4.5;
    else if (cpCenter > ball.y + 10) computer.y -= 4.5;

    if (ball.y + ball.size > canvas.height || ball.y < 0) {
        ball.velY = -ball.velY;
        playSound(200, 0.05);
    }

    let target = (ball.x < canvas.width/2) ? player : computer;
    if (ball.x < target.x + paddleWidth && ball.x + ball.size > target.x &&
        ball.y < target.y + paddleHeight && ball.y + ball.size > target.y) {
        
        let impact = (ball.y - (target.y + paddleHeight/2)) / (paddleHeight/2);
        let angle = impact * (Math.PI/4);
        let direction = (ball.x < canvas.width/2) ? 1 : -1;
        
        ball.velX = direction * CONSTANT_SPEED * Math.cos(angle);
        ball.velY = CONSTANT_SPEED * Math.sin(angle);
        
        ball.x = (ball.x < canvas.width/2) ? (player.x + paddleWidth) : (computer.x - ball.size);
        playSound(440, 0.08);
    }

    // Still reset if ball leaves screen, just no score added
    if (ball.x < -50 || ball.x > canvas.width + 50) {
        resetBall();
    }
}

function render() {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Minimal dashed line
    ctx.fillStyle = "#222";
    for(let i=5; i<canvas.height; i+=25) {
        ctx.fillRect(canvas.width/2 - 1, i, 2, 15);
    }

    ctx.fillStyle = "#ddd";
    ctx.fillRect(player.x, player.y, paddleWidth, paddleHeight);
    ctx.fillRect(computer.x, computer.y, paddleWidth, paddleHeight);
    ctx.fillRect(ball.x, ball.y, ball.size, ball.size);
}

function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
