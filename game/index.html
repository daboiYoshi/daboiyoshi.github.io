<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Arcade</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styling.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>

    <div id="game-wrapper">
        <div id="ui-layer">
            <div class="stat-box">Score: <span id="score">000</span></div>
            <div class="stat-box">Best: <span id="high-score">000</span></div>
        </div>

        <div id="canvas-container">
            <canvas id="gameCanvas"></canvas>
            
            <div id="overlay">
                <h2 id="msg-title">SNAKE ARCADE</h2>
                <p id="msg-body">Use Arrows or WASD</p>
                <button class="btn" id="start-btn">START GAME</button>
            </div>
        </div>
    </div>

    <div id="mobile-controls">
        <div class="dir-btn up" onclick="handleInput('ArrowUp')">▲</div>
        <div class="dir-btn left" onclick="handleInput('ArrowLeft')">◀</div>
        <div class="dir-btn down" onclick="handleInput('ArrowDown')">▼</div>
        <div class="dir-btn right" onclick="handleInput('ArrowRight')">▶</div>
    </div>

    <script src="logic.js"></script>
</body>
</html>
