<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>docs.daboiyoshi.com</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #2d3436;
            --accent-color: #0984e3;
            --border-color: #dfe6e9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: var(--accent-color);
        }

        p {
            color: #636e72;
            margin-bottom: 2rem;
        }

        .file-list {
            text-align: left;
            border-top: 1px solid var(--border-color);
        }

        .file-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            text-decoration: none;
            color: var(--text-main);
            transition: background 0.2s;
        }

        .file-item:hover {
            background-color: #f9f9f9;
        }

        .icon {
            margin-right: 15px;
            font-size: 1.2rem;
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.85rem;
        }

        .footer a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>docs.daboiyoshi.com</h1>
    <p>Resource Directory & Repository for Snake Arcade</p>

    <div class="file-list">
        
    </div>

    <div class="footer">
        Main Site: <a href="https://www.daboiyoshi.com">www.daboiyoshi.com</a>
    </div>
</div>

</body>
</html>
